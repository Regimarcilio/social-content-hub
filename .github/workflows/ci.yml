name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint || true

      - name: Type Check (Build)
        run: npm run build

      - name: Testes
        run: npm test

      - name: SAST (KaliMaster)
        run: npm run sast || true

  quality-gate:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Verificar qualidade
        run: |
          echo "✅ CI aprovada - qualidade gate passou"
          echo "📋 Próximo: merge permitido para develop"
